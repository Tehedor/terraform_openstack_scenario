#cloud-config
package_update: true
packages:
  - wget
  - git
  - unzip

runcmd:
  # Crear usuario para MinIO
  - [ bash, -lc, 'useradd -m -s /bin/bash minio-user || true' ]

  # Crear directorios
  - [ bash, -lc, 'mkdir -p /home/minio-user/minio_data' ]
  - [ bash, -lc, 'chown -R minio-user:minio-user /home/minio-user/minio_data' ]

  # Descargar MinIO server
  - [ bash, -lc, 'wget https://dl.min.io/server/minio/release/linux-amd64/minio -O /usr/local/bin/minio' ]
  - [ bash, -lc, 'chmod +x /usr/local/bin/minio' ]

  # Clonar el repositorio que contiene la imagen
  - [ bash, -lc, 'mkdir -p /tmp/web_clone && git clone --depth=1 https://github.com/Tehedor/web_php_basica.git /tmp/web_clone' ]

  # Crear bucket y copiar la imagen
  - [ bash, -lc, 'sudo -u minio-user /usr/local/bin/minio server /home/minio-user/minio_data --console-address ":9001" & sleep 5' ]
  - [ bash, -lc, 'mkdir -p /home/minio-user/minio_data/objetos' ]
  - [ bash, -lc, 'cp /tmp/web_clone/objetos/image.jpg /home/minio-user/minio_data/objetos/' ]
  - [ bash, -lc, 'chown -R minio-user:minio-user /home/minio-user/minio_data/objetos' ]

  # Crear servicio systemd para MinIO
  - [ bash, -lc, 'cat <<EOF > /etc/systemd/system/minio.service
[Unit]
Description=MinIO
After=network.target

[Service]
User=minio-user
Group=minio-user
ExecStart=/usr/local/bin/minio server /home/minio-user/minio_data --console-address ":9001"
Restart=always
LimitNOFILE=65536

[Install]
WantedBy=multi-user.target
EOF' ]

  # Recargar systemd y habilitar MinIO
  - [ bash, -lc, 'systemctl daemon-reload' ]
  - [ bash, -lc, 'systemctl enable minio && systemctl start minio' ]
