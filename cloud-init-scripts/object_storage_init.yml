#cloud-config
package_update: true
packages:
  - wget
  - git
  - unzip

users:
  - name: minio-user
    shell: /bin/bash
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    lock_passwd: false

write_files:
  - path: /etc/systemd/system/minio.service
    owner: root:root
    permissions: '0644'
    content: |
      [Unit]
      Description=MinIO
      After=network.target

      [Service]
      User=minio-user
      Group=minio-user
      ExecStart=/usr/local/bin/minio server /home/minio-user/minio_data --console-address ":9001"
      Restart=always
      LimitNOFILE=65536

      [Install]
      WantedBy=multi-user.target

runcmd:
  # Crear directorios para MinIO
  - [ bash, -lc, 'mkdir -p /home/minio-user/minio_data/objetos' ]
  - [ bash, -lc, 'chown -R minio-user:minio-user /home/minio-user/minio_data' ]

  # Descargar MinIO server
  - [ bash, -lc, 'mkdir -p /usr/local/bin && wget -q https://dl.min.io/server/minio/release/linux-amd64/minio -O /usr/local/bin/minio' ]
  - [ bash, -lc, 'chmod +x /usr/local/bin/minio' ]

  # Clonar repositorio con la imagen
  - [ bash, -lc, 'mkdir -p /tmp/web_clone && git clone --depth=1 https://github.com/Tehedor/web_php_basica.git /tmp/web_clone' ]

  # Copiar imagen al bucket
  - [ bash, -lc, 'cp /tmp/web_clone/objetos/image.jpg /home/minio-user/minio_data/objetos/' ]
  - [ bash, -lc, 'chown -R minio-user:minio-user /home/minio-user/minio_data/objetos' ]

  # Recargar systemd y habilitar MinIO
  - [ bash, -lc, 'systemctl daemon-reload' ]
  - [ bash, -lc, 'systemctl enable minio' ]
  - [ bash, -lc, 'systemctl start minio' ]
